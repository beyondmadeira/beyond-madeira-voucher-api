<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;width:1080px;height:1350px;font-family:Arial,Helvetica,sans-serif;position:relative;overflow:hidden;
       background:linear-gradient(160deg,#155E75 0%,#1E5B3A 60%,#0d2a1b 100%)}
  .photo-note{position:absolute;top:30%;width:100%;text-align:center;color:rgba(244,242,237,.3);font-size:24px;letter-spacing:3px}
  .rubrica{position:absolute;top:64px;left:64px;background:rgba(16,20,24,.75);color:#F4F2ED;font-size:24px;font-weight:700;letter-spacing:5px;padding:12px 24px;border-radius:6px}
  .ano{position:absolute;top:64px;right:64px;background:#E0A63C;color:#101418;font-size:26px;font-weight:800;letter-spacing:2px;padding:12px 22px;border-radius:6px}
  .panel{position:absolute;bottom:0;left:0;right:0;background:rgba(16,20,24,.94);padding:56px 64px 48px}
  .big{display:flex;align-items:baseline;gap:26px}
  .num{color:#E0A63C;font-size:170px;font-weight:800;line-height:.9}
  .rest{color:#F4F2ED;font-size:62px;font-weight:800;line-height:1.02;letter-spacing:-1px}
  .rest small{display:block;color:#c9c4b8;font-weight:400;font-size:30px;letter-spacing:1px;margin-top:10px}
  .teaser{margin-top:36px;border-top:1px solid rgba(255,255,255,.14);padding-top:28px;display:flex;flex-direction:column;gap:14px}
  .t{color:#c9c4b8;font-size:29px}
  .t b{color:#F4F2ED}
  .t.more{color:#E0A63C;font-weight:700}
  .brand{position:absolute;bottom:20px;right:64px;color:#4e5964;font-size:18px;letter-spacing:4px;font-weight:700}
</style></head><body>
  <div class="photo-note">[ FOTOGRAFIA REAL A SANGRAR ]</div>
  <div class="rubrica">DAILY PICKS</div>
  <div class="ano">2026</div>
  <div class="panel">
    <div class="big">
      <div class="num">7</div>
      <div class="rest">DAYS IN MADEIRA<small>the local route — tour buses can't follow this one</small></div>
    </div>
    <div class="teaser">
      <div class="t"><b>Day 1</b> — sunrise above the clouds (park before 6am)</div>
      <div class="t"><b>Day 3</b> — the north coast tunnel + the pool nobody signs</div>
      <div class="t more">+ mapa, preços reais e as regras novas dos trilhos →</div>
    </div>
  </div>
  <div class="brand">MADEIRA DAILY</div>
</body></html>
