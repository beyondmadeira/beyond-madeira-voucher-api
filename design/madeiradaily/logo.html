<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;width:1200px;height:800px;background:#101418;display:flex;align-items:center;justify-content:center;gap:110px;font-family:Arial,Helvetica,sans-serif}
  .lock{display:flex;flex-direction:column;align-items:center}
  .m{color:#F4F2ED;font-size:104px;font-weight:800;letter-spacing:4px;line-height:1}
  .m .a{position:relative;display:inline-block}
  .m .a:after{content:"";position:absolute;right:-2px;top:12px;width:0;height:0;border-left:16px solid #101418;border-bottom:16px solid transparent}
  .d{color:#E0A63C;font-size:26px;font-weight:500;letter-spacing:30px;margin-top:18px;text-indent:30px}
  .rule{width:120px;height:5px;background:#1E5B3A;border-radius:3px;margin-top:34px}
  .avatar{width:280px;height:280px;border-radius:50%;background:#101418;border:6px solid #1E5B3A;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .avatar .md{color:#F4F2ED;font-size:96px;font-weight:800;letter-spacing:2px;line-height:1}
  .avatar .dot{width:44px;height:5px;background:#E0A63C;border-radius:3px;margin-top:14px}
  .cap{position:absolute;bottom:34px;width:100%;text-align:center;color:#4e5964;font-size:16px;letter-spacing:2px}
</style></head><body>
  <div class="lock">
    <div class="m">M<span class="a">A</span>DEIR<span class="a">A</span></div>
    <div class="d">DAILY</div>
    <div class="rule"></div>
  </div>
  <div class="avatar"><div class="md">MD</div><div class="dot"></div></div>
  <div class="cap">MASTHEAD PRINCIPAL&nbsp;&nbsp;·&nbsp;&nbsp;AVATAR (testar a 40px)</div>
</body></html>
