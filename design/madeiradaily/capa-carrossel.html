<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;width:1080px;height:1350px;font-family:Arial,Helvetica,sans-serif;position:relative;overflow:hidden;
       background:linear-gradient(180deg,#155E75 0%,#1E5B3A 55%,#101418 100%)}
  .photo-note{position:absolute;top:44%;width:100%;text-align:center;color:rgba(244,242,237,.35);font-size:26px;letter-spacing:3px}
  .rubrica{position:absolute;top:70px;left:70px;background:#1E5B3A;color:#F4F2ED;font-size:26px;font-weight:700;
           letter-spacing:6px;padding:14px 28px;border-radius:6px}
  .grad{position:absolute;bottom:0;left:0;right:0;height:52%;background:linear-gradient(180deg,transparent, rgba(16,20,24,.92) 62%)}
  .headline{position:absolute;bottom:200px;left:70px;right:70px;color:#F4F2ED;font-size:96px;font-weight:800;
            line-height:1.02;letter-spacing:-1px}
  .headline em{font-style:normal;color:#E0A63C}
  .sub{position:absolute;bottom:130px;left:70px;color:#c9c4b8;font-size:34px;letter-spacing:1px}
  .brand{position:absolute;bottom:56px;left:70px;display:flex;align-items:baseline;gap:12px}
  .brand .b1{color:#F4F2ED;font-weight:800;font-size:30px;letter-spacing:2px}
  .brand .b2{color:#E0A63C;font-weight:500;font-size:15px;letter-spacing:8px}
  .swipe{position:absolute;bottom:56px;right:70px;color:#E0A63C;font-size:26px;letter-spacing:2px}
</style></head><body>
  <div class="photo-note">[ FOTOGRAFIA A SANGRAR — nunca filtrada para a marca ]</div>
  <div class="rubrica">DAILY PICKS</div>
  <div class="grad"></div>
  <div class="headline">7 DAYS IN MADEIRA<br><em>the local route</em></div>
  <div class="sub">The itinerary tour buses can't follow — 2026 rules included</div>
  <div class="brand"><span class="b1">MADEIRA</span><span class="b2">DAILY</span></div>
  <div class="swipe">SWIPE →</div>
</body></html>
