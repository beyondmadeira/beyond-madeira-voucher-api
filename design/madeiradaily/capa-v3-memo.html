<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;width:1080px;height:1350px;font-family:Arial,Helvetica,sans-serif;background:#F4F2ED;position:relative;overflow:hidden;color:#101418}
  .top{display:flex;justify-content:space-between;align-items:center;padding:56px 64px 0}
  .rubrica{color:#1E5B3A;font-size:26px;font-weight:800;letter-spacing:6px}
  .num{color:#8a8577;font-size:24px;letter-spacing:2px}
  .headline{padding:120px 64px 0;font-size:110px;font-weight:800;line-height:1.0;letter-spacing:-2px}
  .headline .gold{color:#B8860B}
  .strike{text-decoration:line-through;text-decoration-color:#c0392b;text-decoration-thickness:7px;color:#8a8577}
  .sub{padding:44px 64px 0;font-size:36px;line-height:1.35;color:#3b3a35;max-width:850px}
  .stamp{position:absolute;right:70px;top:52%;transform:rotate(-9deg);border:5px solid #1E5B3A;color:#1E5B3A;font-size:30px;font-weight:800;letter-spacing:3px;padding:16px 26px;border-radius:10px;opacity:.85}
  .foto{position:absolute;bottom:120px;left:64px;right:64px;height:330px;background:linear-gradient(120deg,#155E75,#1E5B3A);border-radius:18px;display:flex;align-items:center;justify-content:center;color:rgba(244,242,237,.45);font-size:22px;letter-spacing:3px}
  .brand{position:absolute;bottom:44px;left:64px;display:flex;align-items:baseline;gap:10px}
  .brand .b1{font-weight:800;font-size:28px;letter-spacing:2px}
  .brand .b2{color:#B8860B;font-weight:600;font-size:14px;letter-spacing:8px}
  .save{position:absolute;bottom:44px;right:64px;color:#1E5B3A;font-size:24px;font-weight:700;letter-spacing:1px}
</style></head><body>
  <div class="top"><div class="rubrica">DAILY PICKS</div><div class="num">Nº 12 · 2026</div></div>
  <div class="headline"><span class="strike">The tourist route.</span><br>The <span class="gold">local</span> route.<br>7 days, done right.</div>
  <div class="sub">Com as regras novas dos trilhos, os preços reais e o dia em que deves acordar às 5:40 (só um).</div>
  <div class="stamp">TESTADO NO TERRENO</div>
  <div class="foto">[ 1 FOTOGRAFIA FORTE — não 5 fracas ]</div>
  <div class="brand"><span class="b1">MADEIRA</span><span class="b2">DAILY</span></div>
  <div class="save">SAVE THIS ⌁</div>
</body></html>
